<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="d1_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Fig. 3.5 Data Flow Diagram — Level 1 (Core Subsystems &amp; Stores)</text>

  <!-- Top Row Processes -->
  <!-- 1.0 Temporal Replay -->
  <g transform="translate(60, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <text x="100" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0369a1">1.0 Temporal Replay</text>
    <text x="100" y="44" text-anchor="middle" font-size="9.5" fill="#64748b">Simulated Clock (T) Control</text>
  </g>

  <!-- 2.0 Multi-Agent Engine -->
  <g transform="translate(380, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="100" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">2.0 Multi-Agent Engine</text>
    <text x="100" y="44" text-anchor="middle" font-size="9.5" fill="#64748b">6 Specialized Domain Agents</text>
  </g>

  <!-- 3.0 Deterministic Math -->
  <g transform="translate(700, 75)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <text x="100" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">3.0 Deterministic Math</text>
    <text x="100" y="44" text-anchor="middle" font-size="9" fill="#64748b">Z-Score, MAD, ROP, EOQ, SLA</text>
  </g>

  <!-- Middle Row Processes -->
  <!-- 4.0 Cross-Domain Orchestrator -->
  <g transform="translate(220, 215)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
    <text x="110" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991b1b">4.0 Cross-Domain Orchestrator</text>
    <text x="110" y="44" text-anchor="middle" font-size="9.5" fill="#64748b">Arbitration &amp; Systemic Health</text>
  </g>

  <!-- 5.0 HITL Policy Engine -->
  <g transform="translate(520, 215)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <text x="110" y="26" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">5.0 HITL Policy Engine</text>
    <text x="110" y="44" text-anchor="middle" font-size="9.5" fill="#64748b">AUTO vs NEEDS_APPROVAL Gates</text>
  </g>

  <!-- Bottom Row Data Stores -->
  <!-- D1: Commercial Store -->
  <g transform="translate(160, 365)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="55" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="28" y1="0" x2="28" y2="55" stroke="#1e293b" stroke-width="1.8"/>
    <text x="14" y="32" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">D1</text>
    <text x="124" y="24" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Commercial Store</text>
    <text x="124" y="42" text-anchor="middle" font-size="9.5" fill="#64748b">(orders, order_items, products)</text>
  </g>

  <!-- D2: Operational Ledger -->
  <g transform="translate(580, 365)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="55" rx="4" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <line x1="28" y1="0" x2="28" y2="55" stroke="#1e293b" stroke-width="1.8"/>
    <text x="14" y="32" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">D2</text>
    <text x="124" y="24" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Operational Ledger</text>
    <text x="124" y="42" text-anchor="middle" font-size="9.5" fill="#64748b">(agent_runs, findings, approvals, audit)</text>
  </g>

  <!-- Connecting Arrows -->
  <!-- 1.0 -> 2.0 -->
  <line x1="260" y1="105" x2="378" y2="105" stroke="#1e293b" stroke-width="1.6" marker-end="url(#d1_arr)"/>

  <!-- 2.0 <-> 3.0 -->
  <line x1="580" y1="95" x2="698" y2="95" stroke="#1e293b" stroke-width="1.6" marker-end="url(#d1_arr)"/>
  <line x1="700" y1="115" x2="582" y2="115" stroke="#1e293b" stroke-width="1.6" marker-end="url(#d1_arr)"/>

  <!-- 2.0 -> 4.0 -->
  <line x1="450" y1="135" x2="360" y2="213" stroke="#1e293b" stroke-width="1.6" marker-end="url(#d1_arr)"/>

  <!-- 4.0 -> 5.0 -->
  <line x1="440" y1="245" x2="518" y2="245" stroke="#1e293b" stroke-width="1.6" marker-end="url(#d1_arr)"/>

  <!-- 1.0 -> D1 -->
  <path d="M 160 135 V 363" stroke="#1e293b" stroke-width="1.6" fill="none" marker-end="url(#d1_arr)"/>

  <!-- 4.0 -> D1 -->
  <line x1="310" y1="275" x2="280" y2="363" stroke="#1e293b" stroke-width="1.6" marker-end="url(#d1_arr)"/>

  <!-- 5.0 -> D2 -->
  <line x1="640" y1="275" x2="680" y2="363" stroke="#1e293b" stroke-width="1.6" marker-end="url(#d1_arr)"/>
</svg>