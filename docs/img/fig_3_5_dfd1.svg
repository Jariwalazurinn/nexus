<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    
    <!-- Arrow Markers -->
    <marker id="arr_slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="510" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Fig. 3.5 Data Flow Diagram — Level 1 (Core Operational Subsystems)</text>
  <text x="510" y="52" text-anchor="middle" font-size="11" fill="#64748b">Asynchronous Event Ingestion, Multi-Agent Diagnostic Slices &amp; Zero-Trust HITL Governance Routing</text>

  <!-- ============================================================== -->
  <!-- PROCESS CARDS (TOP ROW) -->
  <!-- ============================================================== -->

  <!-- Process 1.0: Temporal Ingestion -->
  <g transform="translate(50, 75)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="220" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="30" rx="10" fill="#2563eb"/>
    <rect x="0" y="15" width="220" height="15" fill="#2563eb"/>
    <text x="110" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Process 1.0</text>
    <text x="110" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Temporal Ingestion</text>
    <text x="110" y="70" text-anchor="middle" font-size="10.5" fill="#475569">Simulated Clock (Time T)</text>
    <text x="110" y="86" text-anchor="middle" font-size="9.5" fill="#0284c7">Monotonic Monitored Stream</text>
  </g>

  <!-- Process 2.0: Multi-Agent Diagnostics -->
  <g transform="translate(380, 75)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="30" rx="10" fill="#7c3aed"/>
    <rect x="0" y="15" width="240" height="15" fill="#7c3aed"/>
    <text x="120" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Process 2.0</text>
    <text x="120" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Multi-Agent Diagnostics</text>
    <text x="120" y="70" text-anchor="middle" font-size="10.5" fill="#475569">6 Domain ReAct Agents</text>
    <text x="120" y="86" text-anchor="middle" font-size="9.5" fill="#6d28d9">Deterministic Math (Z, MAD, ROP)</text>
  </g>

  <!-- Process 3.0: Cross-Domain Orchestrator -->
  <g transform="translate(730, 75)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="240" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="30" rx="10" fill="#d97706"/>
    <rect x="0" y="15" width="240" height="15" fill="#d97706"/>
    <text x="120" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Process 3.0</text>
    <text x="120" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Cross-Domain Orchestrator</text>
    <text x="120" y="70" text-anchor="middle" font-size="10.5" fill="#475569">Conflict Resolution &amp; Health</text>
    <text x="120" y="86" text-anchor="middle" font-size="9.5" fill="#b45309">Synthesizes Global Score</text>
  </g>

  <!-- ============================================================== -->
  <!-- DATA STORES (MIDDLE ROW) -->
  <!-- ============================================================== -->

  <!-- Data Store D1: Transactional Store -->
  <g transform="translate(100, 260)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="84" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="36" height="84" rx="8" fill="#334155"/>
    <rect x="18" y="0" width="18" height="84" fill="#334155"/>
    <text x="18" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">D1</text>
    <text x="160" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Transactional Data Store</text>
    <text x="160" y="52" text-anchor="middle" font-size="11" font-family="'Consolas', monospace" fill="#2563eb">orders, order_items, products</text>
    <text x="160" y="70" text-anchor="middle" font-size="9.5" fill="#64748b">Indexed Olist &amp; DataCo Enterprise DB</text>
  </g>

  <!-- Data Store D2: Audit Ledger -->
  <g transform="translate(620, 260)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="84" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="36" height="84" rx="8" fill="#334155"/>
    <rect x="18" y="0" width="18" height="84" fill="#334155"/>
    <text x="18" y="47" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">D2</text>
    <text x="160" y="32" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Operational Audit Ledger</text>
    <text x="160" y="52" text-anchor="middle" font-size="11" font-family="'Consolas', monospace" fill="#7c3aed">agent_runs, findings, actions</text>
    <text x="160" y="70" text-anchor="middle" font-size="9.5" fill="#64748b">Append-Only Transactional State</text>
  </g>

  <!-- ============================================================== -->
  <!-- HITL POLICY ENGINE (BOTTOM ROW) -->
  <!-- ============================================================== -->
  <g transform="translate(360, 460)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="280" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="30" rx="10" fill="#dc2626"/>
    <rect x="0" y="15" width="280" height="15" fill="#dc2626"/>
    <text x="140" y="20" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">Process 4.0</text>
    <text x="140" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">HITL Policy Engine</text>
    <text x="140" y="70" text-anchor="middle" font-size="10.5" fill="#475569">Zero-Trust Action Authorization</text>
    <text x="140" y="86" text-anchor="middle" font-size="9.5" font-weight="600" fill="#991b1b">AUTO vs NEEDS_APPROVAL Router</text>
  </g>

  <!-- ============================================================== -->
  <!-- ORTHOGONAL FLOW CONNECTORS WITH BADGES -->
  <!-- ============================================================== -->

  <!-- Flow 1: 1.0 -> 2.0 (Clock Tick) -->
  <path d="M 270 123 H 378" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr_slate)"/>
  <rect x="290" y="110" width="70" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="325" y="124" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Clock Tick</text>

  <!-- Flow 2: 2.0 -> 3.0 (Findings) -->
  <path d="M 620 123 H 728" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr_slate)"/>
  <rect x="642" y="110" width="66" height="20" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="675" y="124" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Findings</text>

  <!-- Flow 3: 1.0 -> D1 (Filter ts <= T) -->
  <path d="M 160 171 V 258" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arr_blue)"/>
  <rect x="115" y="205" width="90" height="22" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="160" y="219" text-anchor="middle" font-size="9" font-weight="600" fill="#1d4ed8">Filter ts &lt;= T</text>

  <!-- Flow 4: 2.0 -> D1 (Query Slices) -->
  <path d="M 440 171 V 215 H 320 V 258" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arr_slate)"/>
  <rect x="330" y="204" width="80" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="218" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Query Slices</text>

  <!-- Flow 5: 2.0 -> D2 (Store Runs) -->
  <path d="M 560 171 V 215 H 680 V 258" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arr_slate)"/>
  <rect x="585" y="204" width="75" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="622" y="218" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Store Runs</text>

  <!-- Flow 6: 3.0 -> D2 (Decisions) -->
  <path d="M 850 171 V 258" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arr_slate)"/>
  <rect x="810" y="205" width="80" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="850" y="219" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Decisions</text>

  <!-- Flow 7: 3.0 -> 4.0 (CLEAN ORTHOGONAL ROUTE - NO CROSSING) -->
  <path d="M 970 123 H 995 V 508 H 642" stroke="#dc2626" stroke-width="2.2" fill="none" stroke-dasharray="6,4" marker-end="url(#arr_red)"/>
  <!-- Route Badge -->
  <rect x="705" y="497" width="130" height="22" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="770" y="512" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b91c1c">Proposed Mutations</text>

  <!-- Flow 8: 4.0 -> D1 (Execute Action) -->
  <path d="M 360 508 H 240 V 346" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arr_green)"/>
  <rect x="185" y="420" width="110" height="22" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="240" y="434" text-anchor="middle" font-size="9.5" font-weight="700" fill="#15803d">Execute Action</text>

  <!-- Flow 9: 4.0 -> D2 (Audit State) -->
  <path d="M 500 460 V 390 H 760 V 346" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#arr_slate)"/>
  <rect x="600" y="379" width="80" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="640" y="393" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Audit State</text>
</svg>