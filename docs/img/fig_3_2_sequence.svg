<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="sd_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="sd_ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="sd_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="sd_orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="sd_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Fig. 3.2 Sequence Diagram — Agent Diagnostic Sweep &amp; Telemetry Stream</text>

  <!-- Lifeline Headers -->
  <rect x="30" y="45" width="115" height="30" rx="5" fill="#3b82f6"/>
  <text x="87" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">React 19 SPA</text>
  <line x1="87" y1="75" x2="87" y2="520" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="180" y="45" width="125" height="30" rx="5" fill="#0284c7"/>
  <text x="242" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">FastAPI Gateway</text>
  <line x1="242" y1="75" x2="242" y2="520" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="340" y="45" width="135" height="30" rx="5" fill="#8b5cf6"/>
  <text x="407" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">LangGraph Engine</text>
  <line x1="407" y1="75" x2="407" y2="520" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="510" y="45" width="145" height="30" rx="5" fill="#059669"/>
  <text x="582" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Database</text>
  <line x1="582" y1="75" x2="582" y2="520" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="690" y="45" width="135" height="30" rx="5" fill="#10b981"/>
  <text x="757" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Deterministic Math</text>
  <line x1="757" y1="75" x2="757" y2="520" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="860" y="45" width="115" height="30" rx="5" fill="#f59e0b"/>
  <text x="917" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Guarded LLM</text>
  <line x1="917" y1="75" x2="917" y2="520" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <!-- Messages -->
  <!-- 1: POST /api/v1/agents/{name}/run (JWT) -->
  <line x1="87" y1="100" x2="240" y2="100" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sd_arr)"/>
  <text x="160" y="93" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e293b">1: POST /api/v1/agents/{name}/run (JWT)</text>

  <!-- 2: Verify RBAC Role -->
  <path d="M 242 110 C 270 105, 270 120, 244 122" stroke="#0284c7" stroke-width="1.3" fill="none" marker-end="url(#sd_arr)"/>
  <text x="278" y="117" font-size="9" fill="#0369a1">2: Verify RBAC Role</text>

  <!-- 3: execute_agent(clock=T) -->
  <line x1="242" y1="135" x2="405" y2="135" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sd_arr)"/>
  <text x="325" y="128" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e293b">3: execute_agent(clock=T)</text>

  <!-- 4: SELECT WHERE timestamp <= T -->
  <line x1="407" y1="160" x2="580" y2="160" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sd_arr)"/>
  <text x="495" y="153" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e293b">4: SELECT WHERE timestamp &lt;= T</text>

  <!-- 5: Return Historical Slice -->
  <line x1="582" y1="190" x2="409" y2="190" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#sd_ret)"/>
  <text x="495" y="183" text-anchor="middle" font-size="9" fill="#475569">5: Return Historical Slice</text>

  <!-- 6: compute_rop_eoq() & modified_z_score() -->
  <line x1="407" y1="220" x2="755" y2="220" stroke="#10b981" stroke-width="1.5" marker-end="url(#sd_green)"/>
  <text x="580" y="213" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#059669">6: compute_rop_eoq() &amp; modified_z_score()</text>

  <!-- 7: Verified Outliers & Stock Metrics -->
  <line x1="757" y1="250" x2="409" y2="250" stroke="#10b981" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#sd_green)"/>
  <text x="580" y="243" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">7: Verified Outliers &amp; Stock Metrics</text>

  <!-- 8: Format Evidence & Action Plan -->
  <line x1="407" y1="280" x2="915" y2="280" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#sd_orange)"/>
  <text x="660" y="273" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#d97706">8: Format Evidence &amp; Action Plan</text>

  <!-- 9: Structured Diagnostic Summary -->
  <line x1="917" y1="310" x2="409" y2="310" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#sd_orange)"/>
  <text x="660" y="303" text-anchor="middle" font-size="9" font-weight="600" fill="#d97706">9: Structured Diagnostic Summary</text>

  <!-- 10: INSERT agent_runs, agent_findings -->
  <line x1="407" y1="340" x2="580" y2="340" stroke="#1e293b" stroke-width="1.5" marker-end="url(#sd_arr)"/>
  <text x="495" y="333" text-anchor="middle" font-size="9.5" font-weight="600" fill="#1e293b">10: INSERT agent_runs, agent_findings</text>

  <!-- 11: Commit Transaction -->
  <path d="M 582 350 C 610 345, 610 360, 584 362" stroke="#059669" stroke-width="1.3" fill="none" marker-end="url(#sd_arr)"/>
  <text x="618" y="357" font-size="9" fill="#047857">11: Commit Transaction</text>

  <!-- 12: Return Run Snapshot JSON -->
  <line x1="407" y1="380" x2="244" y2="380" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#sd_ret)"/>
  <text x="325" y="373" text-anchor="middle" font-size="9" fill="#475569">12: Return Run Snapshot JSON</text>

  <!-- 13: 200 OK + Healthcard & Actions -->
  <line x1="242" y1="410" x2="89" y2="410" stroke="#10b981" stroke-width="1.5" marker-end="url(#sd_green)"/>
  <text x="165" y="403" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#059669">13: 200 OK + Healthcard &amp; Actions</text>

  <!-- 14: Real-time SSE / State Update -->
  <line x1="242" y1="440" x2="89" y2="440" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sd_blue)"/>
  <text x="165" y="433" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2563eb">14: Real-time SSE / State Update</text>
</svg>