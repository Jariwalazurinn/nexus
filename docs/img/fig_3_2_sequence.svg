<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="sar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <marker id="sret" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="sws" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="470" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Fig. 3.2 Sequence Diagram — Asynchronous Ingestion, Agent Triage, and State Fan-Out</text>
  
  <!-- Lifeline Headers -->
  <rect x="30" y="45" width="110" height="32" rx="6" fill="#2563eb"/>
  <text x="85" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">User (SPA)</text>
  <line x1="85" y1="77" x2="85" y2="510" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="185" y="45" width="120" height="32" rx="6" fill="#0284c7"/>
  <text x="245" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">FastAPI Gateway</text>
  <line x1="245" y1="77" x2="245" y2="510" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="345" y="45" width="130" height="32" rx="6" fill="#7c3aed"/>
  <text x="410" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LangGraph Agent</text>
  <line x1="410" y1="77" x2="410" y2="510" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="515" y="45" width="120" height="32" rx="6" fill="#059669"/>
  <text x="575" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Database &amp; Math</text>
  <line x1="575" y1="77" x2="575" y2="510" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="675" y="45" width="120" height="32" rx="6" fill="#d97706"/>
  <text x="735" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Cognitive LLM</text>
  <line x1="735" y1="77" x2="735" y2="510" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <rect x="830" y="45" width="100" height="32" rx="6" fill="#dc2626"/>
  <text x="880" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Event SSE</text>
  <line x1="880" y1="77" x2="880" y2="510" stroke="#cbd5e1" stroke-dasharray="4,4"/>

  <!-- Activation bars -->
  <rect x="80" y="95" width="10" height="390" fill="#e2e8f0"/>
  <rect x="240" y="100" width="10" height="375" fill="#bae6fd"/>
  <rect x="405" y="140" width="10" height="295" fill="#ddd6fe"/>
  <rect x="570" y="160" width="10" height="55" fill="#a7f3d0"/>
  <rect x="730" y="240" width="10" height="45" fill="#fde68a"/>
  <rect x="570" y="325" width="10" height="40" fill="#a7f3d0"/>
  <rect x="875" y="415" width="10" height="60" fill="#fecaca"/>

  <!-- Calls -->
  <line x1="90" y1="105" x2="240" y2="105" stroke="#1e293b" stroke-width="1.8" marker-end="url(#sar)"/>
  <text x="165" y="98" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">1: POST /analyze (JWT)</text>

  <path d="M 250 120 C 278 115, 278 135, 250 137" stroke="#0284c7" stroke-width="1.5" fill="none" marker-end="url(#sar)"/>
  <text x="285" y="130" font-size="9.5" fill="#0369a1">2: Verify RBAC Role</text>

  <line x1="250" y1="145" x2="405" y2="145" stroke="#1e293b" stroke-width="1.8" marker-end="url(#sar)"/>
  <text x="325" y="138" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">3: run_analysis(exec_id)</text>

  <line x1="415" y1="165" x2="570" y2="165" stroke="#1e293b" stroke-width="1.8" marker-end="url(#sar)"/>
  <text x="490" y="158" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">4: SELECT telemetry WHERE ts &lt;= T</text>

  <line x1="570" y1="205" x2="415" y2="205" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#sret)"/>
  <text x="490" y="198" text-anchor="middle" font-size="9.5" fill="#475569">5: Return Raw Slices</text>

  <line x1="415" y1="240" x2="730" y2="240" stroke="#1e293b" stroke-width="1.8" marker-end="url(#sar)"/>
  <text x="572" y="233" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">6: Triage Intent &amp; Extract Entities</text>

  <line x1="730" y1="275" x2="415" y2="275" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#sret)"/>
  <text x="572" y="268" text-anchor="middle" font-size="9.5" fill="#475569">7: Structured Plan &amp; Parameters</text>

  <path d="M 415 300 C 455 290, 455 330, 415 335" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#sar)"/>
  <text x="460" y="315" font-size="9.5" font-weight="bold" fill="#6d28d9">8: Compute Z-Score, MAD,</text>
  <text x="460" y="330" font-size="9.5" font-weight="bold" fill="#6d28d9">Tukey Fences &amp; ROP/EOQ</text>

  <line x1="415" y1="365" x2="570" y2="365" stroke="#1e293b" stroke-width="1.8" marker-end="url(#sar)"/>
  <text x="490" y="358" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">9: INSERT agent_runs, findings</text>

  <line x1="415" y1="415" x2="875" y2="415" stroke="#dc2626" stroke-width="1.8" marker-end="url(#sar)"/>
  <text x="645" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">10: Broadcast Telemetry Event</text>

  <line x1="405" y1="440" x2="250" y2="440" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#sret)"/>
  <text x="325" y="433" text-anchor="middle" font-size="9.5" fill="#475569">11: Return Result Payload</text>

  <line x1="240" y1="465" x2="90" y2="465" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#sret)"/>
  <text x="165" y="458" text-anchor="middle" font-size="9.5" fill="#475569">12: HTTP 200 OK (Telemetry Updated)</text>

  <line x1="875" y1="485" x2="90" y2="485" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#sws)"/>
  <text x="480" y="480" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2563eb">13: Real-Time SSE Push to Live Grid</text>
</svg>