<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 750" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="ucShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="uc_arr_slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="uc_arr_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="uc_arr_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="uc_arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="uc_arr_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="540" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Fig. 3.1 Use Case Diagram — CommerceOS Platform Execution</text>
  <text x="540" y="50" text-anchor="middle" font-size="11" fill="#64748b">Role-Based Actor Interactions, Deterministic Agent Automation &amp; Human-in-the-Loop Governance</text>

  <!-- ============================================================== -->
  <!-- SYSTEM BOUNDARY -->
  <!-- ============================================================== -->
  <rect x="250" y="65" width="560" height="660" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="7,5" filter="url(#ucShadow)"/>
  
  <g transform="translate(390, 52)">
    <rect x="0" y="0" width="280" height="26" rx="6" fill="#2563eb"/>
    <text x="140" y="17" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">CommerceOS Autonomous Boundary</text>
  </g>

  <!-- ============================================================== -->
  <!-- ACTORS (LEFT SIDE) -->
  <!-- ============================================================== -->

  <!-- Actor 1: Temporal Replay Engine (Top Left) -->
  <g transform="translate(35, 80)">
    <rect x="15" y="0" width="150" height="90" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#ucShadow)"/>
    <rect x="65" y="12" width="50" height="34" rx="6" fill="#e0f2fe"/>
    <polygon points="85,22 101,29 85,36" fill="#0284c7"/>
    <text x="90" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0369a1">Replay Engine</text>
    <text x="90" y="78" text-anchor="middle" font-size="9.5" fill="#64748b">Simulated Clock (T)</text>
  </g>

  <!-- Actor 2: Operations Analyst / Manager (Middle Left) -->
  <g transform="translate(35, 215)">
    <rect x="15" y="0" width="150" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#ucShadow)"/>
    <!-- Avatar Icon -->
    <circle cx="90" cy="28" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 68 55 C 68 45, 112 45, 112 55 Z" fill="#2563eb"/>
    <text x="90" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Operations Analyst</text>
    <text x="90" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">Telemetry &amp; SQL</text>
    <rect x="40" y="100" width="100" height="15" rx="3" fill="#eff6ff"/>
    <text x="90" y="111" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1d4ed8">OPERATIONS_ROLE</text>
  </g>

  <!-- Actor 3: Domain Administrator (Bottom Left) -->
  <g transform="translate(35, 385)">
    <rect x="15" y="0" width="150" height="120" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" filter="url(#ucShadow)"/>
    <!-- Avatar Icon -->
    <circle cx="90" cy="28" r="15" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <path d="M 68 55 C 68 45, 112 45, 112 55 Z" fill="#16a34a"/>
    <text x="90" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Domain Admin</text>
    <text x="90" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">Orders / Inventory / CS</text>
    <rect x="40" y="100" width="100" height="15" rx="3" fill="#f0fdf4"/>
    <text x="90" y="111" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803d">DOMAIN_ADMIN_ROLE</text>
  </g>

  <!-- ============================================================== -->
  <!-- ACTORS (RIGHT SIDE) -->
  <!-- ============================================================== -->

  <!-- Actor 4: Super Administrator (Top Right) -->
  <g transform="translate(865, 290)">
    <rect x="15" y="0" width="165" height="125" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8" filter="url(#ucShadow)"/>
    <!-- Avatar Icon -->
    <circle cx="97" cy="28" r="15" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <path d="M 75 55 C 75 45, 119 45, 119 55 Z" fill="#dc2626"/>
    <text x="97" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Super Admin</text>
    <text x="97" y="94" text-anchor="middle" font-size="9.5" fill="#64748b">HITL Approvals Authority</text>
    <rect x="35" y="102" width="125" height="16" rx="3" fill="#fef2f2"/>
    <text x="97" y="114" text-anchor="middle" font-size="8.5" font-weight="700" fill="#b91c1c">SUPER_ADMIN_ROLE</text>
  </g>

  <!-- Actor 5: Multi-Agent System (Bottom Right) -->
  <g transform="translate(865, 490)">
    <rect x="15" y="0" width="165" height="135" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" filter="url(#ucShadow)"/>
    <!-- Robot / AI Agent Icon -->
    <rect x="79" y="14" width="36" height="28" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="89" cy="25" r="3" fill="#7c3aed"/>
    <circle cx="105" cy="25" r="3" fill="#7c3aed"/>
    <line x1="97" y1="14" x2="97" y2="7" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="97" cy="6" r="2.5" fill="#7c3aed"/>
    <path d="M 72 58 C 72 48, 122 48, 122 58 Z" fill="#7c3aed"/>
    <text x="97" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Multi-Agent Team</text>
    <text x="97" y="96" text-anchor="middle" font-size="9.5" fill="#64748b">LangGraph ReAct (6 Agents)</text>
    <rect x="35" y="104" width="125" height="16" rx="3" fill="#f5f3ff"/>
    <text x="97" y="116" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6d28d9">DETERMINISTIC_AI</text>
  </g>

  <!-- ============================================================== -->
  <!-- USE CASE PILLS (CENTER - VERTICALLY STACKED & BEAUTIFULLY SPACED) -->
  <!-- ============================================================== -->

  <!-- UC-1: Control Replay Clock (y=95) -->
  <g transform="translate(300, 95)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#e0f2fe"/>
    <polygon points="25,16 34,21 25,26" fill="#0284c7"/>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0369a1">Control Replay Clock, Playback Speed &amp; Step</text>
  </g>

  <!-- UC-2: View 6-Domain Health Grid (y=155) -->
  <g transform="translate(300, 155)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#eff6ff"/>
    <rect x="22" y="15" width="12" height="12" rx="2" fill="#2563eb"/>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">View 6-Domain Real-Time Operational Health Grid</text>
  </g>

  <!-- UC-3: Trigger Domain Sweep (y=215) -->
  <g transform="translate(300, 215)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#eff6ff"/>
    <circle cx="28" cy="21" r="5" fill="#2563eb"/>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">Trigger On-Demand Diagnostic Domain Sweep</text>
  </g>

  <!-- UC-4: Audit Backlog & RMA (y=275) -->
  <g transform="translate(300, 275)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#f0fdf4"/>
    <polyline points="23,21 27,25 34,17" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">Audit Orders Backlog &amp; Verify 30-Day RMA Eligibility</text>
  </g>

  <!-- UC-5: Execute Text-to-SQL (y=335) -->
  <g transform="translate(300, 335)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#f0fdf4"/>
    <text x="28" y="25" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#16a34a">SQL</text>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">Execute Read-Only AST-Guarded Text-to-SQL Queries</text>
  </g>

  <!-- UC-6: Review & Authorize HITL (y=395 - HIGHLIGHTED RED) -->
  <g transform="translate(300, 395)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="28" cy="21" r="11" fill="#fee2e2"/>
    <text x="28" y="25" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">!</text>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Authorize High-Value Mutations (PO &gt; $5k, Refunds &gt; $150)</text>
  </g>

  <!-- UC-7: Outlier Profiling (y=455) -->
  <g transform="translate(300, 455)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#f5f3ff"/>
    <text x="28" y="25" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">Z</text>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d28d9">Detect Statistical Bottlenecks (Modified Z-Score &amp; MAD)</text>
  </g>

  <!-- UC-8: ROP & EOQ (y=515) -->
  <g transform="translate(300, 515)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#f5f3ff"/>
    <text x="28" y="25" text-anchor="middle" font-size="9" font-weight="bold" fill="#7c3aed">EOQ</text>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d28d9">Compute Dynamic Reorder Points (ROP) &amp; Batch EOQ</text>
  </g>

  <!-- UC-9: SLA & Delivery Margins (y=575) -->
  <g transform="translate(300, 575)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#f5f3ff"/>
    <polyline points="23,24 27,17 33,22" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d28d9">Calculate Carrier SLA Margins &amp; Late Delivery Probability</text>
  </g>

  <!-- UC-10: Cross-Domain Correlation (y=635) -->
  <g transform="translate(300, 635)" filter="url(#ucShadow)">
    <rect x="0" y="0" width="460" height="42" rx="21" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <circle cx="28" cy="21" r="11" fill="#f5f3ff"/>
    <circle cx="28" cy="21" r="4" fill="#7c3aed"/>
    <text x="240" y="26" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6d28d9">Correlate Multi-Domain Findings &amp; Arbitrate Conflicts</text>
  </g>

  <!-- ============================================================== -->
  <!-- CLEAN DIRECT CONNECTORS (ZERO OVERLAP, ZERO WEIRD CROSSINGS) -->
  <!-- ============================================================== -->

  <!-- Replay Engine -> UC-1 (Horizontal Direct Line) -->
  <path d="M 200 116 H 298" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#uc_arr_blue)"/>

  <!-- Operations Analyst -> UC-1, UC-2, UC-5 -->
  <path d="M 200 250 L 298 128" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#uc_arr_blue)"/>
  <path d="M 200 270 L 298 176" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#uc_arr_blue)"/>
  <path d="M 200 285 L 298 356" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#uc_arr_blue)"/>

  <!-- Domain Admin -> UC-3, UC-4 -->
  <path d="M 200 425 L 298 236" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#uc_arr_green)"/>
  <path d="M 200 445 L 298 296" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#uc_arr_green)"/>

  <!-- Super Admin -> UC-6 (DIRECT HORIZONTAL LINE) -->
  <path d="M 865 375 L 762 410" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#uc_arr_red)"/>
  <!-- Super Admin -> UC-2 (Observes Global Health) -->
  <path d="M 865 340 L 762 185" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#uc_arr_red)"/>

  <!-- Multi-Agent System -> UC-7, UC-8, UC-9, UC-10 (Clean Right-Side Connections) -->
  <path d="M 865 525 L 762 480" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#uc_arr_purple)"/>
  <path d="M 865 545 L 762 536" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#uc_arr_purple)"/>
  <path d="M 865 565 L 762 596" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#uc_arr_purple)"/>
  <path d="M 865 585 L 762 656" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#uc_arr_purple)"/>
</svg>