<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="dfd_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="470" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Fig. 3.4 Data Flow Diagram — Level 0 (Context Level Diagram)</text>

  <!-- Process 0.0 Center (Circle/Oval) -->
  <ellipse cx="470" cy="245" rx="110" ry="60" fill="#ffffff" stroke="#2563eb" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="470" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">0.0</text>
  <text x="470" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">CommerceOS</text>
  <text x="470" y="268" text-anchor="middle" font-size="10" fill="#475569">Autonomous Multi-Agent Engine</text>

  <!-- External Entity: Enterprise Datasets (Top-Left) -->
  <g transform="translate(60, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="65" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="100" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Enterprise Datasets</text>
    <text x="100" y="46" text-anchor="middle" font-size="10" fill="#475569">Olist (100k) &amp; DataCo (180k)</text>
  </g>

  <!-- External Entity: Operations Personnel (Bottom-Left) -->
  <g transform="translate(60, 330)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="65" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="100" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Operations Personnel</text>
    <text x="100" y="46" text-anchor="middle" font-size="10" fill="#475569">Supply Chain Leads &amp; Admins</text>
  </g>

  <!-- External Entity: Warehouse Execution (Top-Right) -->
  <g transform="translate(680, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="65" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="100" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Warehouse Execution</text>
    <text x="100" y="46" text-anchor="middle" font-size="10" fill="#475569">Stock Rebalance &amp; Restock POs</text>
  </g>

  <!-- External Entity: Operations Command UI (Bottom-Right) -->
  <g transform="translate(680, 330)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="65" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
    <text x="100" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Operations Command UI</text>
    <text x="100" y="46" text-anchor="middle" font-size="10" fill="#475569">Telemetry, Alerts &amp; PDF RMAs</text>
  </g>

  <!-- Flows -->
  <!-- [1] Historical Orders & Feeds -->
  <line x1="260" y1="125" x2="390" y2="205" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dfd_arr)"/>
  <rect x="230" y="150" width="180" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="165" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563eb">[1] Historical Orders &amp; Feeds ➔</text>

  <!-- [2] Replay Clock & Approvals -->
  <line x1="260" y1="360" x2="390" y2="280" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dfd_arr)"/>
  <rect x="230" y="310" width="180" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="325" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563eb">[2] Replay Clock &amp; Approvals ➔</text>

  <!-- [3] Restock POs & Directives -->
  <line x1="550" y1="205" x2="680" y2="125" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dfd_arr)"/>
  <rect x="530" y="150" width="180" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="165" text-anchor="middle" font-size="9.5" font-weight="600" fill="#15803d">[3] Restock POs &amp; Directives ➔</text>

  <!-- [4] Live Telemetry & Findings -->
  <line x1="550" y1="280" x2="680" y2="360" stroke="#1e293b" stroke-width="1.8" marker-end="url(#dfd_arr)"/>
  <rect x="530" y="310" width="180" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="620" y="325" text-anchor="middle" font-size="9.5" font-weight="600" fill="#b91c1c">[4] Live Telemetry &amp; Findings ➔</text>
</svg>