<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="dfd0_ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <text x="470" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Fig. 3.4 Data Flow Diagram — Level 0 (Context Level Diagram)</text>

  <!-- External Entity 1: Historical Feeds (Left) -->
  <g transform="translate(40, 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <rect x="0" y="0" width="190" height="28" rx="10" fill="#2563eb"/>
    <text x="95" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">External Entity [E-1]</text>
    <text x="95" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Enterprise Data Feeds</text>
    <text x="95" y="78" text-anchor="middle" font-size="11" fill="#475569">Olist Marketplace (100k)</text>
    <text x="95" y="96" text-anchor="middle" font-size="11" fill="#475569">DataCo Supply Chain (180k)</text>
    <text x="95" y="114" text-anchor="middle" font-size="10" fill="#2563eb">Carrier Tracking Feeds</text>
  </g>

  <!-- Central Process: CommerceOS Core Engine -->
  <g transform="translate(350, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="190" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
    <rect x="20" y="16" width="200" height="26" rx="6" fill="#1e293b"/>
    <text x="120" y="34" text-anchor="middle" font-size="12" font-weight="bold" fill="#38bdf8">Process 0.0</text>
    <text x="120" y="75" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">CommerceOS</text>
    <text x="120" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#93c5fd">Autonomous Core Engine</text>
    <line x1="30" y1="112" x2="210" y2="112" stroke="#334155" stroke-width="1.5"/>
    <text x="120" y="132" text-anchor="middle" font-size="11" fill="#cbd5e1">Deterministic Replay Clock</text>
    <text x="120" y="150" text-anchor="middle" font-size="11" fill="#cbd5e1">6-Domain LangGraph Team</text>
    <text x="120" y="168" text-anchor="middle" font-size="11" fill="#cbd5e1">Zero-Trust HITL Governance</text>
  </g>

  <!-- External Entity 2: Operators & Administrators (Right) -->
  <g transform="translate(710, 190)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
    <rect x="0" y="0" width="190" height="28" rx="10" fill="#16a34a"/>
    <text x="95" y="19" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">External Entity [E-2]</text>
    <text x="95" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Operations Personnel</text>
    <text x="95" y="78" text-anchor="middle" font-size="11" fill="#475569">Operations Analysts</text>
    <text x="95" y="96" text-anchor="middle" font-size="11" fill="#475569">Domain Administrators</text>
    <text x="95" y="114" text-anchor="middle" font-size="10" fill="#16a34a">HITL Super Approvers</text>
  </g>

  <!-- External Entity 3: Downstream Warehouse & Suppliers (Bottom) -->
  <g transform="translate(365, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="85" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
    <rect x="0" y="0" width="210" height="24" rx="10" fill="#dc2626"/>
    <text x="105" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">External Entity [E-3]</text>
    <text x="105" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Suppliers &amp; Warehouses (WMS)</text>
    <text x="105" y="68" text-anchor="middle" font-size="10" fill="#64748b">Automated PO Dispatch &amp; Restock</text>
  </g>

  <!-- FLOW [1]: Ingestion Stream (Left to Center) -->
  <line x1="230" y1="235" x2="348" y2="235" stroke="#1e293b" stroke-width="2.5" marker-end="url(#dfd0_ar)"/>
  <rect x="235" y="200" width="105" height="28" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="287" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">FLOW [1]</text>
  <text x="287" y="225" text-anchor="middle" font-size="8.5" fill="#475569">Raw Ingestion Stream</text>

  <!-- FLOW [2]: Operator Commands (Right to Center) -->
  <line x1="710" y1="235" x2="592" y2="235" stroke="#1e293b" stroke-width="2.5" marker-end="url(#dfd0_ar)"/>
  <rect x="600" y="200" width="105" height="28" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="652" y="214" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">FLOW [2]</text>
  <text x="652" y="225" text-anchor="middle" font-size="8.5" fill="#475569">Replay Clock &amp; Approvals</text>

  <!-- FLOW [4]: Live Telemetry & RMA (Center to Right) -->
  <line x1="590" y1="285" x2="708" y2="285" stroke="#1e293b" stroke-width="2.5" marker-end="url(#dfd0_ar)"/>
  <rect x="600" y="295" width="105" height="28" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
  <text x="652" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="#0369a1">FLOW [4]</text>
  <text x="652" y="320" text-anchor="middle" font-size="8.5" fill="#475569">Live Telemetry &amp; Invoices</text>

  <!-- FLOW [3]: Restock POs (Center to Bottom) -->
  <line x1="470" y1="350" x2="470" y2="428" stroke="#1e293b" stroke-width="2.5" marker-end="url(#dfd0_ar)"/>
  <rect x="475" y="375" width="95" height="28" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="522" y="389" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">FLOW [3]</text>
  <text x="522" y="400" text-anchor="middle" font-size="8.5" fill="#475569">Restock PO Directives</text>
</svg>