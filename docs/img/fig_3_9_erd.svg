<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="er_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Fig. 3.9 Entity-Relationship (ER) Diagram — CommerceOS Operational Schema</text>

  <!-- Row 1: Commercial Domain -->
  <!-- users -->
  <g transform="translate(40, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="150" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#1e293b"/>
    <rect x="0" y="14" width="190" height="14" fill="#1e293b"/>
    <text x="95" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">users</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#2563eb">PK  id: VARCHAR(36)</text>
    <text x="12" y="66" font-size="9.5" fill="#334155">    username: VARCHAR(100)</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">    email: VARCHAR(255)</text>
    <text x="12" y="106" font-size="9.5" fill="#334155">    hashed_password: VARCHAR</text>
    <text x="12" y="126" font-size="9.5" fill="#334155">    role: UserRole Enum</text>
    <text x="12" y="142" font-size="9.5" fill="#334155">    is_active: BOOLEAN</text>
  </g>

  <!-- orders -->
  <g transform="translate(280, 55)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="165" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#2563eb"/>
    <rect x="0" y="14" width="200" height="14" fill="#2563eb"/>
    <text x="100" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">orders</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#1d4ed8">PK  order_id: VARCHAR(50)</text>
    <text x="12" y="64" font-size="9.5" fill="#059669">FK  customer_id: VARCHAR(50)</text>
    <text x="12" y="82" font-size="9.5" fill="#059669">FK  user_id: VARCHAR(36)</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">    order_status: VARCHAR(30)</text>
    <text x="12" y="118" font-size="9.5" fill="#334155">    order_purchase_ts: DATETIME</text>
    <text x="12" y="136" font-size="9.5" fill="#334155">    order_delivered_date: DATETIME</text>
    <text x="12" y="152" font-size="9.5" fill="#334155">    estimated_delivery: DATETIME</text>
    <text x="12" y="165" font-size="9.5" fill="#334155">    total_amount: FLOAT</text>
  </g>

  <!-- order_items -->
  <g transform="translate(530, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="150" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#2563eb"/>
    <rect x="0" y="14" width="190" height="14" fill="#2563eb"/>
    <text x="95" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">order_items</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#1d4ed8">PK  id: INTEGER (AUTO)</text>
    <text x="12" y="66" font-size="9.5" fill="#059669">FK  order_id: VARCHAR(50)</text>
    <text x="12" y="86" font-size="9.5" fill="#059669">FK  product_id: VARCHAR(50)</text>
    <text x="12" y="106" font-size="9.5" fill="#334155">    seller_id: VARCHAR(50)</text>
    <text x="12" y="126" font-size="9.5" fill="#334155">    price: FLOAT</text>
    <text x="12" y="142" font-size="9.5" fill="#334155">    freight_value: FLOAT</text>
  </g>

  <!-- products -->
  <g transform="translate(770, 60)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="150" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#16a34a"/>
    <rect x="0" y="14" width="190" height="14" fill="#16a34a"/>
    <text x="95" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">products</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#15803d">PK  product_id: VARCHAR(50)</text>
    <text x="12" y="66" font-size="9.5" fill="#334155">    category: VARCHAR(60)</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">    product_weight_g: FLOAT</text>
    <text x="12" y="106" font-size="9.5" fill="#334155">    current_stock: INTEGER</text>
    <text x="12" y="126" font-size="9.5" fill="#334155">    reorder_point: INTEGER</text>
    <text x="12" y="142" font-size="9.5" fill="#334155">    safety_stock: INTEGER</text>
  </g>

  <!-- Row 1 Connectors -->
  <!-- users -> orders -->
  <line x1="230" y1="130" x2="278" y2="130" stroke="#2563eb" stroke-width="1.8" marker-end="url(#er_arr)"/>
  <rect x="238" y="120" width="30" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="253" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">1 : N</text>

  <!-- orders -> order_items -->
  <line x1="480" y1="130" x2="528" y2="130" stroke="#2563eb" stroke-width="1.8" marker-end="url(#er_arr)"/>
  <rect x="488" y="120" width="30" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="503" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">1 : N</text>

  <!-- products -> order_items -->
  <line x1="770" y1="130" x2="722" y2="130" stroke="#2563eb" stroke-width="1.8" marker-end="url(#er_arr)"/>
  <rect x="732" y="120" width="30" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="747" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">N : 1</text>

  <!-- Row 2: Operational Ledger -->
  <!-- agent_runs -->
  <g transform="translate(40, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="165" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#7c3aed"/>
    <rect x="0" y="14" width="190" height="14" fill="#7c3aed"/>
    <text x="95" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">agent_runs</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#6d28d9">PK  id: VARCHAR(36)</text>
    <text x="12" y="66" font-size="9.5" fill="#334155">    agent: VARCHAR(40)</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">    trigger: VARCHAR(24)</text>
    <text x="12" y="106" font-size="9.5" fill="#334155">    status: VARCHAR(24)</text>
    <text x="12" y="126" font-size="9.5" fill="#334155">    health: VARCHAR(24)</text>
    <text x="12" y="144" font-size="9.5" fill="#334155">    confidence: FLOAT</text>
    <text x="12" y="160" font-size="9.5" fill="#334155">    started_at: DATETIME</text>
  </g>

  <!-- agent_findings -->
  <g transform="translate(280, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="165" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
    <rect x="0" y="0" width="200" height="28" rx="6" fill="#dc2626"/>
    <rect x="0" y="14" width="200" height="14" fill="#dc2626"/>
    <text x="100" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">agent_findings</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#b91c1c">PK  id: VARCHAR(36)</text>
    <text x="12" y="66" font-size="9.5" fill="#059669">FK  run_id: VARCHAR(36)</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">    agent: VARCHAR(40)</text>
    <text x="12" y="106" font-size="9.5" fill="#334155">    category: VARCHAR(60)</text>
    <text x="12" y="126" font-size="9.5" fill="#334155">    severity: VARCHAR(16)</text>
    <text x="12" y="144" font-size="9.5" fill="#334155">    title: VARCHAR(300)</text>
    <text x="12" y="156" font-size="9.5" fill="#334155">    confidence: FLOAT</text>
    <text x="12" y="166" font-size="8.5" fill="#64748b">    data_status: VARCHAR(24)</text>
  </g>

  <!-- orchestration_decisions -->
  <g transform="translate(530, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="165" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#d97706"/>
    <rect x="0" y="14" width="190" height="14" fill="#d97706"/>
    <text x="95" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">orchestration_decisions</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#92400e">PK  id: VARCHAR(36)</text>
    <text x="12" y="66" font-size="9.5" fill="#334155">    execution_id: VARCHAR(60)</text>
    <text x="12" y="86" font-size="9.5" fill="#334155">    overall_health: VARCHAR(24)</text>
    <text x="12" y="106" font-size="9.5" fill="#334155">    domains: JSON</text>
    <text x="12" y="126" font-size="9.5" fill="#334155">    systemic_findings: JSON</text>
    <text x="12" y="144" font-size="9.5" fill="#334155">    conflicts: JSON</text>
    <text x="12" y="160" font-size="9.5" fill="#334155">    created_at: DATETIME</text>
  </g>

  <!-- automation_actions -->
  <g transform="translate(770, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="165" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#ea580c"/>
    <rect x="0" y="14" width="190" height="14" fill="#ea580c"/>
    <text x="95" y="19" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">automation_actions</text>
    <text x="12" y="46" font-size="9.5" font-weight="bold" fill="#c2410c">PK  id: VARCHAR(36)</text>
    <text x="12" y="64" font-size="9.5" fill="#334155">    agent: VARCHAR(40)</text>
    <text x="12" y="82" font-size="9.5" fill="#334155">    action_type: VARCHAR(60)</text>
    <text x="12" y="100" font-size="9.5" fill="#334155">    mode: AUTO | HITL</text>
    <text x="12" y="118" font-size="9.5" fill="#334155">    status: EXEC | PROPOSED</text>
    <text x="12" y="136" font-size="9" fill="#059669">FK  finding_id: VARCHAR(36)</text>
    <text x="12" y="148" font-size="9" fill="#059669">FK  decision_id: VARCHAR(36)</text>
    <text x="12" y="160" font-size="9" fill="#334155">    approved_by: VARCHAR</text>
  </g>

  <!-- Row 2 Connectors -->
  <!-- users -> agent_runs (vertical down) -->
  <line x1="135" y1="210" x2="135" y2="308" stroke="#2563eb" stroke-width="1.8" marker-end="url(#er_arr)"/>
  <rect x="100" y="250" width="70" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="135" y="262" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e40af">1 : N (Run User)</text>

  <!-- agent_runs -> agent_findings -->
  <line x1="230" y1="390" x2="278" y2="390" stroke="#2563eb" stroke-width="1.8" marker-end="url(#er_arr)"/>
  <rect x="238" y="380" width="30" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="253" y="392" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">1 : N</text>

  <!-- agent_findings -> orchestration_decisions -->
  <line x1="480" y1="390" x2="528" y2="390" stroke="#2563eb" stroke-width="1.8" marker-end="url(#er_arr)"/>
  <rect x="488" y="380" width="30" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="503" y="392" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">M : 1</text>

  <!-- orchestration_decisions -> automation_actions -->
  <line x1="720" y1="390" x2="768" y2="390" stroke="#2563eb" stroke-width="1.8" marker-end="url(#er_arr)"/>
  <rect x="728" y="380" width="30" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="743" y="392" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e40af">1 : N</text>
</svg>