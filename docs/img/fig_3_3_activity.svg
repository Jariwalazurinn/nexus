<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="act_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Fig. 3.3 Activity Diagram — Operational Triage &amp; HITL Routing</text>

  <!-- Initial node -->
  <circle cx="500" cy="55" r="10" fill="#0f172a"/>
  <line x1="500" y1="65" x2="500" y2="85" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>

  <!-- Synchronize Simulated Clock T -->
  <rect x="380" y="85" width="240" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="500" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Synchronize Simulated Clock T</text>

  <!-- Fork Bar -->
  <line x1="500" y1="119" x2="500" y2="135" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="90" y="135" width="820" height="6" rx="2" fill="#0f172a"/>

  <!-- 6 Domain Branches -->
  <!-- 1. Orders Agent -->
  <line x1="140" y1="141" x2="140" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act_arr)"/>
  <rect x="75" y="165" width="130" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="140" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Orders Agent</text>
  <text x="140" y="196" text-anchor="middle" font-size="8.5" fill="#64748b">Backlog &amp; Flow</text>

  <!-- 2. Inventory Agent -->
  <line x1="285" y1="141" x2="285" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act_arr)"/>
  <rect x="220" y="165" width="130" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="285" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Inventory Agent</text>
  <text x="285" y="196" text-anchor="middle" font-size="8.5" fill="#64748b">Stockouts &amp; ROP/EOQ</text>

  <!-- 3. Logistics Agent -->
  <line x1="430" y1="141" x2="430" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act_arr)"/>
  <rect x="365" y="165" width="130" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="430" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Logistics Agent</text>
  <text x="430" y="196" text-anchor="middle" font-size="8.5" fill="#64748b">Transit &amp; SLA Margins</text>

  <!-- 4. Pricing Agent -->
  <line x1="575" y1="141" x2="575" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act_arr)"/>
  <rect x="510" y="165" width="130" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="575" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Pricing Agent</text>
  <text x="575" y="196" text-anchor="middle" font-size="8.5" fill="#64748b">Margin Leakage</text>

  <!-- 5. Marketing Agent -->
  <line x1="720" y1="141" x2="720" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act_arr)"/>
  <rect x="655" y="165" width="130" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="720" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Marketing Agent</text>
  <text x="720" y="196" text-anchor="middle" font-size="8.5" fill="#64748b">RFM Quintiles</text>

  <!-- 6. Customer Support -->
  <line x1="865" y1="141" x2="865" y2="165" stroke="#1e293b" stroke-width="1.4" marker-end="url(#act_arr)"/>
  <rect x="800" y="165" width="130" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="865" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Customer Support</text>
  <text x="865" y="196" text-anchor="middle" font-size="8.5" fill="#64748b">Triage &amp; 30d RMA</text>

  <!-- Join Bar -->
  <line x1="140" y1="207" x2="140" y2="230" stroke="#1e293b" stroke-width="1.4"/>
  <line x1="285" y1="207" x2="285" y2="230" stroke="#1e293b" stroke-width="1.4"/>
  <line x1="430" y1="207" x2="430" y2="230" stroke="#1e293b" stroke-width="1.4"/>
  <line x1="575" y1="207" x2="575" y2="230" stroke="#1e293b" stroke-width="1.4"/>
  <line x1="720" y1="207" x2="720" y2="230" stroke="#1e293b" stroke-width="1.4"/>
  <line x1="865" y1="207" x2="865" y2="230" stroke="#1e293b" stroke-width="1.4"/>
  <rect x="90" y="230" width="820" height="6" rx="2" fill="#0f172a"/>

  <!-- Run Modified Z-Score & MAD Profiler -->
  <line x1="500" y1="236" x2="500" y2="260" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  <rect x="360" y="260" width="280" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="500" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Run Modified Z-Score &amp; MAD Profiler</text>

  <!-- Decision: Deviation Found? -->
  <line x1="500" y1="296" x2="500" y2="320" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  <polygon points="500,320 575,342 500,364 425,342" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="346" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Deviation Found?</text>

  <!-- No Branch: Log Normal Health State -->
  <line x1="575" y1="342" x2="680" y2="342" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  <text x="615" y="334" font-size="9" font-weight="bold" fill="#15803d">No</text>
  <rect x="680" y="324" width="160" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="760" y="346" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">Log Normal Health State</text>

  <!-- Yes Branch: Orchestrator: Cross-Domain Conflict Resolver -->
  <line x1="500" y1="364" x2="500" y2="395" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  <text x="510" y="380" font-size="9" font-weight="bold" fill="#b91c1c">Yes</text>
  <rect x="340" y="395" width="320" height="36" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="500" y="417" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">Orchestrator: Cross-Domain Conflict Resolver</text>

  <!-- Decision: Policy Mode? -->
  <line x1="500" y1="431" x2="500" y2="455" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  <polygon points="500,455 570,475 500,495 430,475" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="479" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">Policy Mode?</text>

  <!-- Left: Mode: AUTO -> Self-Execute Mutation -->
  <line x1="430" y1="475" x2="310" y2="475" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  <rect x="330" y="462" width="75" height="18" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <text x="367" y="474" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e40af">Mode: AUTO</text>
  
  <rect x="150" y="455" width="160" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="230" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Self-Execute Mutation</text>
  <text x="230" y="486" text-anchor="middle" font-size="8" fill="#64748b">(Reservation Rebalance)</text>

  <!-- Right: Mode: NEEDS_APPROVAL -> Queue for Admin Sign-Off -->
  <line x1="570" y1="475" x2="690" y2="475" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  <rect x="585" y="462" width="95" height="18" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
  <text x="632" y="474" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b91c1c">NEEDS_APPROVAL</text>

  <rect x="690" y="455" width="180" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="780" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Queue for Admin Sign-Off</text>
  <text x="780" y="486" text-anchor="middle" font-size="8" fill="#64748b">(Supplier PO / Large Refund)</text>

  <!-- Final Node (Bullseye) Connections -->
  <path d="M 230 495 L 230 540 L 500 540" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 780 495 L 780 540 L 500 540" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 840 342 L 905 342 L 905 540 L 780 540" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <line x1="500" y1="540" x2="500" y2="565" stroke="#1e293b" stroke-width="1.5" marker-end="url(#act_arr)"/>
  
  <circle cx="500" cy="580" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="500" cy="580" r="8" fill="#0f172a"/>
</svg>