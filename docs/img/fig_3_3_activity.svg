<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="aar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
  </defs>
  <text x="470" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Fig. 3.3 Activity Diagram — Autonomous Operations Pipeline and Policy Routing</text>

  <!-- Start -->
  <circle cx="470" cy="60" r="12" fill="#0f172a"/>
  <line x1="470" y1="72" x2="470" y2="100" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>

  <!-- Step 1: Clock tick -->
  <rect x="360" y="100" width="220" height="38" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="470" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Temporal Clock Advance (Time T)</text>
  <line x1="470" y1="138" x2="470" y2="165" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>

  <!-- Step 2: Query DB -->
  <rect x="350" y="165" width="240" height="38" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="470" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Query Telemetry (WHERE ts &lt;= T)</text>
  <line x1="470" y1="203" x2="470" y2="230" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>

  <!-- Step 3: Math Evaluation -->
  <rect x="340" y="230" width="260" height="42" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="470" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">Deterministic Statistical Profiling</text>
  <text x="470" y="264" text-anchor="middle" font-size="9.5" fill="#5b21b6">(Modified Z, MAD, ROP, EOQ, SLA)</text>
  <line x1="470" y1="272" x2="470" y2="305" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>

  <!-- Decision 1: Deviation detected? -->
  <polygon points="470,305 565,340 470,375 375,340" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="470" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">Operational Deviation?</text>

  <!-- No path -->
  <line x1="565" y1="340" x2="720" y2="340" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>
  <text x="630" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">[No: Normal]</text>
  <rect x="720" y="322" width="160" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="800" y="345" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">Log Steady-State Telemetry</text>

  <!-- Yes path -->
  <line x1="470" y1="375" x2="470" y2="405" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>
  <text x="495" y="394" font-size="10" font-weight="bold" fill="#b91c1c">[Yes]</text>

  <!-- Step 4: Cross-Domain Check -->
  <rect x="350" y="405" width="240" height="38" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="470" y="429" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Orchestrator Conflict Triage</text>
  <line x1="470" y1="443" x2="470" y2="470" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>

  <!-- Decision 2: Policy Routing -->
  <polygon points="470,470 565,500 470,530 375,500" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="470" y="504" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">Policy Evaluation</text>

  <!-- Mode Branches -->
  <!-- Left: AUTO -->
  <line x1="375" y1="500" x2="240" y2="500" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>
  <text x="310" y="492" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">[AUTO]</text>
  <rect x="80" y="482" width="160" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="160" y="505" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">Autonomous Execution</text>

  <!-- Right: NEEDS_APPROVAL -->
  <line x1="565" y1="500" x2="700" y2="500" stroke="#1e293b" stroke-width="1.8" marker-end="url(#aar)"/>
  <text x="635" y="492" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">[NEEDS_APPROVAL]</text>
  <rect x="700" y="482" width="170" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="785" y="505" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">Queue to HITL Console</text>
</svg>