<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <marker id="fl_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Fig. 4.1 End-to-End Operational System Flow — CommerceOS</text>

  <!-- Step 1: Replay Event / API Trigger (Clock T) -->
  <rect x="380" y="45" width="200" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="480" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Replay Event / API Trigger (Clock T)</text>
  <line x1="480" y1="79" x2="480" y2="105" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>

  <!-- Step 2: Decision JWT & RBAC Role Valid? -->
  <polygon points="480,105 565,125 480,145 395,125" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="480" y="129" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">JWT &amp; RBAC Role Valid?</text>

  <!-- No Branch -> 401/403 Reject + Audit -->
  <line x1="565" y1="125" x2="680" y2="125" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>
  <text x="615" y="117" font-size="9" font-weight="bold" fill="#b91c1c">No</text>
  <rect x="680" y="108" width="140" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="129" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">401/403 Reject + Audit</text>

  <!-- Yes Branch -> Query Data Slice (timestamp <= T) -->
  <line x1="480" y1="145" x2="480" y2="175" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>
  <text x="490" y="162" font-size="9" font-weight="bold" fill="#15803d">Yes</text>

  <rect x="380" y="175" width="200" height="34" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="480" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Query Data Slice (timestamp &lt;= T)</text>
  <line x1="480" y1="209" x2="480" y2="235" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>

  <!-- Step 3: LangGraph Multi-Agent Execution -->
  <rect x="300" y="235" width="360" height="42" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="480" y="253" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6d28d9">LangGraph Multi-Agent Execution</text>
  <text x="480" y="267" text-anchor="middle" font-size="9" fill="#7c3aed">Orders, Inventory, Logistics, Pricing, Marketing, Support</text>
  <line x1="480" y1="277" x2="480" y2="305" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>

  <!-- Step 4: Decision Operational Outlier? -->
  <polygon points="480,305 565,325 480,345 395,325" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="329" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Operational Outlier?</text>

  <!-- No Branch -> Log Clean Health Telemetry -->
  <line x1="395" y1="325" x2="280" y2="325" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>
  <text x="345" y="317" font-size="9" font-weight="bold" fill="#15803d">No</text>
  <rect x="130" y="308" width="150" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="205" y="329" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">Log Clean Health Telemetry</text>

  <!-- Yes Branch -> Cross-Domain Orchestration & Policy Matrix -->
  <line x1="480" y1="345" x2="480" y2="375" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>
  <text x="490" y="362" font-size="9" font-weight="bold" fill="#b91c1c">Yes</text>

  <rect x="340" y="375" width="280" height="34" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="480" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Cross-Domain Orchestration &amp; Policy Matrix</text>

  <!-- 3 Policy Branches -->
  <line x1="360" y1="409" x2="210" y2="445" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>
  <line x1="480" y1="409" x2="480" y2="445" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>
  <line x1="600" y1="409" x2="750" y2="445" stroke="#1e293b" stroke-width="1.5" marker-end="url(#fl_arr)"/>

  <!-- AUTO Execution -->
  <rect x="110" y="445" width="200" height="42" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="463" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e40af">AUTO Execution</text>
  <text x="210" y="477" text-anchor="middle" font-size="8.5" fill="#64748b">(Reservation Rebalance / RMA)</text>

  <!-- NEEDS_APPROVAL -->
  <rect x="380" y="445" width="200" height="42" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="463" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#92400e">NEEDS_APPROVAL</text>
  <text x="480" y="477" text-anchor="middle" font-size="8.5" fill="#64748b">(Queued in automation_actions)</text>

  <!-- BLOCKED Policy -->
  <rect x="650" y="445" width="200" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="750" y="463" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#991b1b">BLOCKED Policy</text>
  <text x="750" y="477" text-anchor="middle" font-size="8.5" fill="#64748b">(Suppressed; Alert Lead Only)</text>
</svg>