<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="sf_ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <filter id="sf_sh" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Fig. 4.1 End-to-End Operational System Flow Diagram</text>

  <!-- Step 1: Historical Data Ingestion -->
  <g transform="translate(40, 80)" filter="url(#sf_sh)">
    <rect x="0" y="0" width="160" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="24" rx="10" fill="#2563eb"/>
    <text x="80" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">1. Data Ingestion</text>
    <text x="80" y="48" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Olist &amp; DataCo</text>
    <text x="80" y="68" text-anchor="middle" font-size="10" fill="#475569">280,000+ Orders</text>
    <text x="80" y="86" text-anchor="middle" font-size="10" fill="#475569">Freight &amp; SKUs</text>
  </g>

  <!-- Step 2: Temporal Replay Engine -->
  <g transform="translate(260, 80)" filter="url(#sf_sh)">
    <rect x="0" y="0" width="180" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="24" rx="10" fill="#16a34a"/>
    <text x="90" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">2. Temporal Engine</text>
    <text x="90" y="48" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Simulated Clock (T)</text>
    <text x="90" y="68" text-anchor="middle" font-size="10" fill="#475569">Zero Lookahead Leakage</text>
    <text x="90" y="86" text-anchor="middle" font-size="10" fill="#475569">1x to 100x Speed Slider</text>
  </g>

  <!-- Step 3: Multi-Agent Triage -->
  <g transform="translate(500, 80)" filter="url(#sf_sh)">
    <rect x="0" y="0" width="190" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="24" rx="10" fill="#7c3aed"/>
    <text x="95" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">3. Agent Team</text>
    <text x="95" y="48" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">LangGraph ReAct</text>
    <text x="95" y="68" text-anchor="middle" font-size="10" fill="#475569">6 Specialized Domains</text>
    <text x="95" y="86" text-anchor="middle" font-size="10" fill="#475569">Deterministic Math Tools</text>
  </g>

  <!-- Step 4: Cross-Domain Orchestrator -->
  <g transform="translate(750, 80)" filter="url(#sf_sh)">
    <rect x="0" y="0" width="170" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="24" rx="10" fill="#d97706"/>
    <text x="85" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">4. Orchestration</text>
    <text x="85" y="48" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Global Alignment</text>
    <text x="85" y="68" text-anchor="middle" font-size="10" fill="#475569">Conflict Resolution</text>
    <text x="85" y="86" text-anchor="middle" font-size="10" fill="#475569">Systemic Health Score</text>
  </g>

  <!-- Connecting top line -->
  <line x1="200" y1="135" x2="258" y2="135" stroke="#1e293b" stroke-width="2" marker-end="url(#sf_ar)"/>
  <line x1="440" y1="135" x2="498" y2="135" stroke="#1e293b" stroke-width="2" marker-end="url(#sf_ar)"/>
  <line x1="690" y1="135" x2="748" y2="135" stroke="#1e293b" stroke-width="2" marker-end="url(#sf_ar)"/>

  <!-- Step 5: HITL Policy Matrix (Bottom Middle) -->
  <g transform="translate(360, 260)" filter="url(#sf_sh)">
    <rect x="0" y="0" width="240" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
    <rect x="0" y="0" width="240" height="26" rx="12" fill="#dc2626"/>
    <text x="120" y="18" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">5. Zero-Trust Policy Matrix</text>
    <text x="120" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Action Classification</text>
    <text x="120" y="74" text-anchor="middle" font-size="10.5" fill="#166534">AUTO: Safe inventory reservation</text>
    <text x="120" y="92" text-anchor="middle" font-size="10.5" fill="#991b1b">APPROVAL: POs &gt; $5k, Refunds &gt; $150</text>
    <text x="120" y="108" text-anchor="middle" font-size="10" fill="#475569">BLOCKED: Negative margins</text>
  </g>

  <line x1="835" y1="190" x2="570" y2="258" stroke="#1e293b" stroke-width="2" marker-end="url(#sf_ar)"/>

  <!-- Step 6: Dispatch Execution (Bottom Left) -->
  <g transform="translate(80, 420)" filter="url(#sf_sh)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="24" rx="10" fill="#16a34a"/>
    <text x="110" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">6A. Autonomous Execution</text>
    <text x="110" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Warehouse &amp; In-Memory PDF</text>
    <text x="110" y="68" text-anchor="middle" font-size="10" fill="#475569">Volatile RAM RMA Streaming</text>
    <text x="110" y="86" text-anchor="middle" font-size="10" fill="#475569">Safe Inventory Rebalance</text>
  </g>

  <!-- Step 7: Operations Console (Bottom Right) -->
  <g transform="translate(660, 420)" filter="url(#sf_sh)">
    <rect x="0" y="0" width="220" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="24" rx="10" fill="#2563eb"/>
    <text x="110" y="17" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">6B. Operations Portal</text>
    <text x="110" y="48" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">React 19 Telemetry UI</text>
    <text x="110" y="68" text-anchor="middle" font-size="10" fill="#475569">Real-Time SSE Health Grid</text>
    <text x="110" y="86" text-anchor="middle" font-size="10" fill="#475569">One-Click Human Approvals</text>
  </g>

  <line x1="420" y1="380" x2="250" y2="418" stroke="#16a34a" stroke-width="2" marker-end="url(#sf_ar)"/>
  <line x1="540" y1="380" x2="710" y2="418" stroke="#2563eb" stroke-width="2" marker-end="url(#sf_ar)"/>
</svg>